services:
  mongodb:
    image: mongo:6
    container_name: sinapheatmap-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    networks:
      - sinapheatmap-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: sinapheatmap-backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: ${PORT}
      MONGO_URL: ${MONGO_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      # Origens permitidas para CORS (separe por vírgula para múltiplas)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      # Volume para persistir uploads de forma nativa no Docker
      - backend_uploads:/app/uploads
      # Volume para persistir logs de forma nativa no Docker
      - backend_logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - sinapheatmap-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3333/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: sinapheatmap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sinapheatmap-network

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  sinapheatmap-network:
    driver: bridge

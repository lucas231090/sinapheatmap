services:
  mongodb:
    image: mongo:6
    container_name: sinapheatmap-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    networks:
      - sinapheatmap-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: sinapheatmap-backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: ${PORT}
      MONGO_URL: ${MONGO_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./be/uploads:/usr/src/app/uploads
      - ./be/logs:/usr/src/app/logs
    depends_on:
      - mongodb
    networks:
      - sinapheatmap-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3333/server', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:3333"
    container_name: sinapheatmap-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sinapheatmap-network

volumes:
  mongo_data:
    driver: local

networks:
  sinapheatmap-network:
    driver: bridge

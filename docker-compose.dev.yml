services:
  mongodb:
    image: mongo:6
    container_name: sinapheatmap-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - sinapheatmap-network

  backend:
    image: node:20-alpine
    container_name: sinapheatmap-backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3333:3333"
    environment:
      PORT: ${PORT:-3333}
      MONGO_URL: ${MONGO_URL:-mongodb://root:senha123@mongodb:27017/sinapheatmap?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-sinapheatmap/.env.example}
      NODE_ENV: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./be:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - sinapheatmap-network

  frontend:
    image: node:20-alpine
    container_name: sinapheatmap-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:3333}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./fe:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - sinapheatmap-network

volumes:
  mongo_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  sinapheatmap-network:
    driver: bridge
